version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    # majors (TypeScript, vitest, tsdown, commander...) are upgraded deliberately, not by bot PRs
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # 0.x minors are breaking: tsdown 0.23 drops Node 20. Remove after moving CI to Node 22+.
      - dependency-name: tsdown
        update-types: ['version-update:semver-minor']
